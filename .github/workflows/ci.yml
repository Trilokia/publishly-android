name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Unit tests and sample build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The unit tests run against real data checked into the repo (update JSON, the promo
      # template, saved Play pages); the sample build proves the library modules and the
      # AboutLibraries plugin still work together
      - name: Test the library
        run: ./gradlew :kit:testDebugUnitTest :kit-promo:testDebugUnitTest :kit-oss:testDebugUnitTest --no-daemon --stacktrace

      - name: Build the sample app
        run: ./gradlew :sample:assembleDebug --no-daemon --stacktrace

      # R8 and the release lint (including the Fragment rule that kit/build.gradle.kts guards against)
      - name: Build the sample app (release)
        run: ./gradlew :sample:assembleRelease :sample:lintVitalRelease --no-daemon --stacktrace

      - name: Publish the modules to the local Maven repo
        run: ./gradlew publishToMavenLocal --no-daemon

      # Only kit-promo may ask to see other apps; an app with kit (and kit-compose) alone must not
      - name: Check package visibility
        run: |
          for m in kit kit-compose; do
            if grep -q "<queries" "$m/build/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml"; then
              echo "::error::$m declares <queries>; package visibility belongs in kit-promo only"; exit 1
            fi
          done
          grep -q "android.intent.category.LAUNCHER" kit-promo/build/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            kit/build/reports/tests/testDebugUnitTest
            kit-promo/build/reports/tests/testDebugUnitTest
            kit-oss/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
